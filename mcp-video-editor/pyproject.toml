[project]
name = "mcp-video-editor"
version = "0.1.0"
description = "Servidor MCP de edição de vídeo com FFmpeg (cortar, juntar, legendas, texto, marca d'água, conversão...)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    # FastMCP (mcp.server.fastmcp) existe na série 1.x; na 2.x foi renomeado para MCPServer.
    "mcp[cli]>=1.12,<2",
]

[dependency-groups]
dev = ["pytest>=8"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
