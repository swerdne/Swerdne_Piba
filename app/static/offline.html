<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#02030F">
<title>Sem internet - TyBenson</title>
<!-- Tela "sem internet" do app instalado (PWA): o service worker guarda esta
     pagina na instalacao e mostra ela quando uma pagina nao carrega por falta
     de rede -- no lugar do erro do navegador. Estatica de proposito: nenhum
     dado de conta (ver app/static/js/service-worker.js). -->
<style>
    html,body{margin:0;height:100%;background:#02030F;color:#F4F8FF;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
    main{min-height:100%;min-height:100dvh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:24px;box-sizing:border-box;text-align:center}
    img{width:84px;height:auto;margin-bottom:6px}
    h1{margin:0;font-size:20px;font-weight:700}
    p{margin:0;max-width:320px;color:#9AA6BF;font-size:14px;line-height:1.5}
    button{margin-top:10px;border:0;border-radius:999px;padding:12px 26px;font-size:15px;font-weight:600;color:#fff;background:#4f46e5;cursor:pointer}
</style>
</head>
<body>
<main>
    <img src="/static/img/logo-mini.webp" alt="TyBenson">
    <h1>Sem conexão com a internet</h1>
    <p>Confira o Wi-Fi ou os dados móveis. Assim que a conexão voltar, a página abre sozinha.</p>
    <button type="button" onclick="location.reload()">Tentar de novo</button>
</main>
<script>
    window.addEventListener("online", function () { location.reload(); });
</script>
</body>
</html>
