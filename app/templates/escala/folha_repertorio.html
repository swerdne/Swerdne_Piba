<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{ 'Projecao' if tipo == 'projecao' else 'Cifras' }} - {{ nome_documento }}</title>
<style>
    * { box-sizing: border-box; }
    body { margin: 0; background: #e5e7eb; color: #111827; font-family: Arial, Helvetica, sans-serif; }
    .barra { position: sticky; top: 0; display: flex; gap: 8px; align-items: center; justify-content: space-between;
             padding: 10px 16px; background: #111827; color: #fff; font-size: 14px; z-index: 1; }
    .barra a, .barra button { color: #fff; background: #4f46e5; border: 0; border-radius: 999px; padding: 8px 16px;
             font-size: 14px; font-weight: 600; text-decoration: none; cursor: pointer; }
    .barra a { background: transparent; border: 1px solid #4b5563; }
    .folha { background: #fff; max-width: 210mm; margin: 16px auto; padding: 18mm 16mm; box-shadow: 0 4px 16px rgba(0,0,0,.12); }
    h1 { font-size: 20px; margin: 0 0 4px; text-transform: uppercase; }
    .sub { font-size: 15px; font-weight: 700; margin: 0 0 18px; text-transform: uppercase; }
    .indice { margin: 0 0 22px; padding-left: 0; list-style: none; font-size: 14px; }
    .indice li { margin: 3px 0; font-weight: 700; text-transform: uppercase; }
    .musica { margin: 0 0 26px; }
    .musica h2 { font-size: 16px; margin: 0 0 2px; text-transform: uppercase; }
    .obs { font-size: 13px; margin: 0 0 10px; color: #374151; }
    .bloco { margin: 0 0 12px; break-inside: avoid; }
    .rotulo { font-size: 12px; font-weight: 700; color: #4338ca; margin: 0 0 2px; }
    .linha { font-size: 14px; line-height: 1.45; text-transform: uppercase; margin: 0; }
    pre { font-family: ui-monospace, Menlo, Consolas, "Courier New", monospace; font-size: 15px; line-height: 1.45;
          white-space: pre-wrap; margin: 8px 0 0; }
    /* Acordes em cor forte e negrito (a fonte da cifra inteira e que e maior:
       acorde maior que a letra quebraria o alinhamento em fonte monoespacada). */
    .acorde { color: #ea580c; font-weight: 700; }
    @media print { .acorde { -webkit-print-color-adjust: exact; print-color-adjust: exact; } }
    .vazio { font-size: 13px; color: #9ca3af; font-style: italic; }
    .gerais { border-top: 2px solid #111827; padding-top: 10px; margin-top: 10px; }
    .gerais h3 { font-size: 14px; margin: 0 0 4px; }
    .gerais p { font-size: 13px; white-space: pre-line; margin: 0; }
    .quebra { break-before: page; }

    /* ---- Folha de PROJECAO: formato do modelo do ministerio (Google Docs) ---- */
    .proj-titulo { text-align: center; font-size: 20px; font-weight: 800; text-transform: uppercase; margin: 0 0 12px; }
    .proj-separador { border: 0; border-top: 1.5px solid #9ca3af; margin: 0 0 20px; }
    .proj-culto { text-align: center; margin: 0 0 22px; font-size: 17px; font-weight: 800; }
    .proj-culto mark { background: #f8d0cf; color: #111827; padding: 2px 8px; }
    .proj-culto .nome { text-transform: uppercase; }
    .proj-musica { margin: 0 0 30px; }
    .proj-nome { text-align: center; font-size: 15px; font-weight: 800; margin: 0 0 12px; }
    .proj-info { margin: 0 0 12px 22px; padding: 0; font-size: 14px; }
    .proj-info li { margin: 0 0 4px; }
    .proj-info mark { color: #111827; padding: 1px 4px; }
    .amarelo { background: #fdecc8; }
    .verde { background: #d5f0d8; }
    .proj-letra { border: 1.5px solid #111827; column-count: 2; column-gap: 24px; column-rule: 1.5px solid #111827;
                  padding: 4px 12px; }
    .proj-letra .bloco { break-inside: avoid; margin: 12px 0; }
    .proj-letra .rotulo { font-size: 14px; font-weight: 400; color: #111827; margin: 0 0 12px; }
    .proj-letra .linha { font-size: 15px; line-height: 1.3; text-transform: uppercase; margin: 0; }
    .proj-letra .refrao .linha { font-weight: 800; }
    .proj-letra .vazio { column-span: all; }
    @media (max-width: 640px) { .proj-letra { column-count: 1; column-rule: none; } }
    @media print { mark, .proj-letra { -webkit-print-color-adjust: exact; print-color-adjust: exact; } }
    @media (max-width: 640px) { .folha { margin: 0; padding: 20px 16px; box-shadow: none; } }
    @media print {
        body { background: #fff; }
        .barra { display: none; }
        .folha { margin: 0; padding: 0; box-shadow: none; max-width: none; }
        @page { margin: 15mm; }
    }
</style>
</head>
<body>
<div class="barra">
    <a href="{{ voltar_url }}">&larr; Voltar</a>
    <span>{{ 'Folha de projecao' if tipo == 'projecao' else 'Cifras do louvor' }}</span>
    <button type="button" onclick="window.print()">Imprimir / PDF</button>
</div>

<div class="folha">
    {% if tipo == 'projecao' %}
    {# Formato do modelo de projecao do ministerio -- ver o .proj-* no <style>. #}
    <h1 class="proj-titulo">&#127926; {{ titulo }} &#127926;</h1>
    <hr class="proj-separador">
    {% if culto_nome or subtitulo %}
    <p class="proj-culto"><mark>&#9728;&#65039; <span class="nome">{{ culto_nome or subtitulo }}</span>{% if culto_horario %} &ndash; {{ culto_horario }}{% endif %}</mark></p>
    {% endif %}

    {% for it in itens %}
    <section class="proj-musica">
        <h2 class="proj-nome">{{ loop.index }}. [{{ it.nome|upper }}]{% if it.momento %} - {{ it.momento }}{% endif %}</h2>
        <ul class="proj-info">
            <li><mark class="amarelo">&#9888;&#65039; Observa&ccedil;&otilde;es:{% if it.tom %} TOM {{ it.tom }}{% endif %}</mark></li>
            <li><mark class="verde">&#127908; Letra:</mark></li>
        </ul>
        <div class="proj-letra">
            {% for bloco in it.blocos %}
            {% set eh_refrao = bloco.rotulo and ('REFR' in bloco.rotulo|upper or 'CORO' in bloco.rotulo|upper) %}
            <div class="bloco {{ 'refrao' if eh_refrao }}">
                {% if bloco.rotulo %}<p class="rotulo">[{{ bloco.rotulo|upper }}]</p>{% endif %}
                {% for linha in bloco.linhas %}<p class="linha">{{ linha }}</p>{% endfor %}
            </div>
            {% else %}
            <p class="vazio">{{ 'Letra de projecao ainda nao cadastrada no banco.' if it.musica else 'Musica avulsa -- fora do banco de musicas.' }}</p>
            {% endfor %}
        </div>
    </section>
    {% else %}
    <p class="vazio">{{ vazio }}</p>
    {% endfor %}

    {% else %}
    <h1>{{ titulo }}</h1>
    <p class="sub">{{ subtitulo }}</p>

    {% if not itens %}
    <p class="vazio">{{ vazio }}</p>
    {% else %}
    <ol class="indice">
        {% for it in itens %}
        <li>{{ loop.index }}. {{ it.nome }}{% if it.momento %} - {{ it.momento }}{% endif %}</li>
        {% endfor %}
    </ol>

    {% for it in itens %}
    <section class="musica {{ 'quebra' if not loop.first }}">
        <h2>{{ loop.index }}. {{ it.nome }}{% if it.momento %} - {{ it.momento }}{% endif %}</h2>
        <p class="obs">
            {% if it.musica and it.musica.artista %}{{ it.musica.artista }} &middot; {% endif %}
            Observacoes: {% if it.tom %}TOM {{ it.tom }}{% if it.tom_original %} (transposta do original em {{ it.tom_original }}){% endif %}{% else %}-{% endif %}
        </p>
        {% if it.cifra %}
        <pre>{{ it.cifra_html }}</pre>
        {% else %}
        <p class="vazio">{{ 'Cifra ainda nao cadastrada no banco.' if it.musica else 'Musica avulsa -- fora do banco de musicas.' }}</p>
        {% endif %}
    </section>
    {% endfor %}
    {% endif %}
    {% endif %}

    {% if observacoes %}
    <div class="gerais">
        <h3>OBSERVACOES GERAIS</h3>
        <p>{{ observacoes }}</p>
    </div>
    {% endif %}
</div>
</body>
</html>
